<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Quick Translate 测试页</title>
  <style>
    body {
      margin: 0;
      padding: 60px 80px;
      max-width: 760px;
      font: 17px/1.9 Georgia, "Times New Roman", serif;
      color: #1f2328;
      background: #fbfbfd;
    }
    h1 { font: 600 26px/1.4 system-ui, sans-serif; margin-bottom: 8px; }
    p { margin: 0 0 18px; }
    .note { font: 13px/1.7 system-ui, sans-serif; color: #6b7280; }
  </style>
</head>
<body>
  <h1>Selection test page</h1>
  <p id="para">
    Good tools make boring work valuable. A translation panel should appear right where your
    attention already is, so you never lose the thread of what you were reading.
  </p>
  <p class="note">Drag across the paragraph above to select text, then use the floating panel.</p>
</body>
</html>
